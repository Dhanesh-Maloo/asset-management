services:
  - type: web
    name: asset-app-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: asset_management
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: ZEPTOMAIL_API_URL
        value: https://api.zeptomail.com/v1.1/email
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Asset Management
